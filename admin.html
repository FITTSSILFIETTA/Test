<!DOCTYPE html>
<html lang="ru">
<head>
    <script src="database.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - FITTSSILFI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-container { display: flex; flex-direction: column; gap: 30px; max-width: 800px; margin: 0 auto; }
        .panel { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .admin-form label { display: block; margin-top: 15px; font-weight: 500; }
        .admin-form input, .admin-form textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px; font-family: inherit; }
        .admin-form button[type="submit"] { margin-top: 20px; width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        
        .admin-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; border-bottom: 1px solid #eee; }
        .admin-item-info { display: flex; align-items: center; gap: 15px; }
        .admin-item-info img { width: 40px; height: 60px; object-fit: contain; background: #f8f9fa; border-radius: 4px; }
        .admin-item-actions button { padding: 8px 12px; margin-left: 5px; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
        .btn-edit { background: #ffc107; color: #000; }
        .btn-delete { background: #dc3545; color: #fff; }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #f8f9fa; padding: 15px; border-radius: 8px; text-align: center; border: 1px solid #e0e0e0; }
        .stat-card h4 { margin: 0 0 5px; color: #777; font-size: 14px; font-weight: normal; }
        .stat-card span { font-size: 24px; font-weight: bold; color: var(--text-color); }
        .log-list { max-height: 200px; overflow-y: auto; background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 12px; padding: 15px; border-radius: 8px; }
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid #333; padding-bottom: 5px; }

        /* Стили для ИИ-кнопки */
        .ai-helper-btn { background: #8e44ad; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; font-weight: bold; font-size: 16px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.3s; }
        .ai-helper-btn:hover { background: #732d91; }
        .ai-status { text-align: center; color: #8e44ad; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = "login.html";
        }
    </script>

    <header>
        <div class="logo">⚡ FITTSSILFI</div>
        <nav><a href="index.html">Каталог</a></nav>
    </header>

    <main>
        <div class="admin-container">
            
            <div class="panel">
                <h2 style="margin-bottom: 20px;">📊 Статистика коллекции</h2>
                <div class="stats-grid" id="statsGrid"></div>
            </div>

            <div class="panel admin-form">
                <h2 id="formTitle" style="text-align: center; margin-bottom: 20px;">Добавить новую банку</h2>
                <form id="addCanForm">
                    <input type="hidden" id="editId" value="">
                    
                    <label>Название банки (введи и нажми кнопку ниже)</label>
                    <input type="text" id="canName" required placeholder="Например: Tornado Mango">
                    
                    <!-- Кнопка ИИ -->
                    <button type="button" class="ai-helper-btn" onclick="askAI()">🪄 Пусть ИИ заполнит всё за меня</button>
                    <div id="aiStatus" class="ai-status">🔄 ИИ изучает банку и пишет данные...</div>

                    <label>Ссылка на картинку (URL)</label>
                    <input type="url" id="canImage" required placeholder="https://example.com/can.jpg">

                    <label>Бренд</label>
                    <input type="text" id="canBrand" required placeholder="Бренд">
                    
                    <label>Цвет банки</label>
                    <input type="color" id="canColor" value="#ffcc00">
                    
                    <label>Оценка (1-10)</label>
                    <input type="number" id="canRating" min="1" max="10" value="10">
                    
                    <label>Вкус</label>
                    <input type="text" id="canTaste" placeholder="Вкус">
                    
                    <label>Газация</label>
                    <input type="text" id="canGas" placeholder="Газация">
                    
                    <label>Бодрость</label>
                    <input type="text" id="canEnergy" placeholder="Бодрость">
                    
                    <label>Твой отзыв</label>
                    <textarea id="canReview" placeholder="Отзыв..."></textarea>
                    
                    <button type="submit" id="submitBtn">Добавить в каталог</button>
                    <button type="button" id="cancelBtn" style="display:none; width: 100%; margin-top: 10px; padding: 10px; background: #6c757d; color: #fff; border: none; border-radius: 8px; cursor: pointer;" onclick="resetForm()">Отмена</button>
                </form>
            </div>

            <div class="panel">
                <h2 style="margin-bottom: 20px;">Твои банки</h2>
                <div id="adminListContainer"></div>
            </div>

            <div class="panel">
                <h2 style="margin-bottom: 20px;">📝 Журнал действий (Логи)</h2>
                <div class="log-list" id="logContainer"></div>
                <button onclick="clearLogs()" style="margin-top: 15px; background: #dc3545; color: #fff; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;">Очистить логи</button>
            </div>

        </div>
    </main>

    <script>
        let cans = JSON.parse(localStorage.getItem('energyCans')) || [];
        cans = cans.filter(can => can && can.id);
        localStorage.setItem('energyCans', JSON.stringify(cans));

        // --- ЛОГИ ---
        function addLog(action) {
            let logs = JSON.parse(localStorage.getItem('adminLogs')) || [];
            const now = new Date();
            const timeString = now.toLocaleDateString() + ' ' + now.toLocaleTimeString();
            logs.push(`[${timeString}] ${action}`);
            localStorage.setItem('adminLogs', JSON.stringify(logs));
            renderLogs();
        }

        function renderLogs() {
            const container = document.getElementById('logContainer');
            const logs = JSON.parse(localStorage.getItem('adminLogs')) || [];
            if (logs.length === 0) { container.innerHTML = '<div style="color: #888;">Логов пока нет...</div>'; return; }
            container.innerHTML = logs.slice(-20).reverse().map(log => `<div class="log-entry">${log}</div>`).join('');
        }

        function clearLogs() {
            if(confirm('Очистить все логи?')) { localStorage.removeItem('adminLogs'); renderLogs(); }
        }

        // --- УМНЫЙ ИИ-ПОМОЩНИК ---
        async function askAI() {
            const name = document.getElementById('canName').value;
            if (!name) { alert("Сначала введи название банки! Например: Tornado Mango"); return; }

            const status = document.getElementById('aiStatus');
            status.style.display = 'block';
            
            // Очищаем поля перед заполнением
            document.getElementById('canBrand').value = '';
            document.getElementById('canTaste').value = '';
            document.getElementById('canGas').value = '';
            document.getElementById('canEnergy').value = '';
            document.getElementById('canReview').value = '';

            try {
                // Составляем строгий промпт
                const prompt = `Ты эксперт по энергетическим напиткам. Дай ТОЧНУЮ информацию о напитке "${name}". 
ВАЖНО: Если ты не знаешь точный вкус или бренд этой банки, напиши "Не найдено" вместо того, чтобы выдумывать. Не фантазируй.
Ответь СТРОГО в формате JSON без лишнего текста, без markdown:
{"brand": "название бренда", "taste": "вкус", "gas": "газация (сильная/средняя/слабая)", "energy": "эффект бодрости", "review": "твой короткий отзыв об этом напитке"}`;

                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                let aiText = await response.text();
                
                // Очищаем ответ от возможного мусора (кавычек, markdown)
                aiText = aiText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                // Ищем первую фигурную скобку и последнюю
                const start = aiText.indexOf('{');
                const end = aiText.lastIndexOf('}');
                if (start !== -1 && end !== -1) {
                    aiText = aiText.substring(start, end + 1);
                }

                const data = JSON.parse(aiText);

                // Заполняем поля с небольшой задержкой для эффекта "печатания"
                setTimeout(() => { document.getElementById('canBrand').value = data.brand || ''; }, 300);
                setTimeout(() => { document.getElementById('canTaste').value = data.taste || ''; }, 600);
                setTimeout(() => { document.getElementById('canGas').value = data.gas || ''; }, 900);
                setTimeout(() => { document.getElementById('canEnergy').value = data.energy || ''; }, 1200);
                setTimeout(() => { 
                    document.getElementById('canReview').value = data.review || ''; 
                    status.style.display = 'none'; // Прячем статус после заполнения
                    addLog(`🪄 ИИ заполнил данные для: ${name}`);
                }, 1500);

            } catch (error) {
                console.error(error);
                status.innerHTML = "❌ ИИ не смог распознать банку. Заполни вручную.";
                setTimeout(() => status.style.display = 'none', 3000);
            }
        }

        // --- СТАТИСТИКА ---
        function renderStats() {
            const grid = document.getElementById('statsGrid');
            if (cans.length === 0) { grid.innerHTML = '<p style="grid-column: span 2; text-align:center; color:#777;">Добавь банки, чтобы увидеть статистику.</p>'; return; }
            const totalRating = cans.reduce((sum, can) => sum + Number(can.rating), 0);
            const avgRating = (totalRating / cans.length).toFixed(1);
            const uniqueBrands = new Set(cans.map(c => c.brand)).size;
            grid.innerHTML = `
                <div class="stat-card"><h4>Всего банок</h4><span>${cans.length}</span></div>
                <div class="stat-card"><h4>Средний балл</h4><span>${avgRating} / 10</span></div>
                <div class="stat-card" style="grid-column: span 2;"><h4>Уникальных брендов</h4><span>${uniqueBrands}</span></div>
            `;
        }

        // --- СПИСОК ---
        function renderAdminList() {
            const container = document.getElementById('adminListContainer');
            container.innerHTML = '';
            if (cans.length === 0) { container.innerHTML = '<p style="text-align: center; color: #777;">Пока нет добавленных банок.</p>'; return; }
            const sortedCans = [...cans].reverse();
            sortedCans.forEach(can => {
                const item = document.createElement('div');
                item.className = 'admin-item';
                item.innerHTML = `
                    <div class="admin-item-info">
                        <img src="${can.image}" alt="${can.name}" onerror="this.src='https://via.placeholder.com/40x60?text=No'">
                        <div><strong>${can.name}</strong><br><small style="color: #777;">${can.brand} | ${can.rating}/10</small></div>
                    </div>
                    <div class="admin-item-actions">
                        <button class="btn-edit" onclick="editCan('${can.id}')">✏️</button>
                        <button class="btn-delete" onclick="deleteCan('${can.id}')">🗑️</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // --- ОБРАБОТКА ФОРМЫ ---
        document.getElementById('addCanForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const editId = document.getElementById('editId').value;
            const canData = {
                id: editId || Date.now().toString(),
                name: document.getElementById('canName').value,
                brand: document.getElementById('canBrand').value,
                image: document.getElementById('canImage').value,
                color: document.getElementById('canColor').value,
                rating: document.getElementById('canRating').value,
                taste: document.getElementById('canTaste').value,
                gas: document.getElementById('canGas').value,
                energy: document.getElementById('canEnergy').value,
                review: document.getElementById('canReview').value
            };

            if (editId) {
                const index = cans.findIndex(c => c.id === editId);
                if (index !== -1) cans[index] = canData;
                addLog(`✏️ Отредактирована банка: ${canData.name}`);
                alert('Банка обновлена!');
            } else {
                cans.push(canData);
                addLog(`➕ Добавлена банка: ${canData.name}`);
                alert('Банка добавлена!');
            }

            localStorage.setItem('energyCans', JSON.stringify(cans));
            resetForm();
            renderAdminList();
            renderStats();
        });

        function editCan(id) {
            const can = cans.find(c => c.id === id);
            if (!can) return;
            document.getElementById('editId').value = can.id;
            document.getElementById('canName').value = can.name;
            document.getElementById('canBrand').value = can.brand;
            document.getElementById('canImage').value = can.image;
            document.getElementById('canColor').value = can.color || '#ffcc00';
            document.getElementById('canRating').value = can.rating;
            document.getElementById('canTaste').value = can.taste || '';
            document.getElementById('canGas').value = can.gas || '';
            document.getElementById('canEnergy').value = can.energy || '';
            document.getElementById('canReview').value = can.review || '';
            document.getElementById('formTitle').innerText = 'Редактировать банку';
            document.getElementById('submitBtn').innerText = 'Сохранить изменения';
            document.getElementById('submitBtn').style.background = '#28a745';
            document.getElementById('cancelBtn').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function deleteCan(id) {
            if (confirm('Удалить банку?')) {
                const canName = cans.find(c => c.id === id)?.name || 'Неизвестно';
                cans = cans.filter(c => c.id !== id);
                localStorage.setItem('energyCans', JSON.stringify(cans));
                addLog(`🗑️ Удалена банка: ${canName}`);
                renderAdminList();
                renderStats();
            }
        }

        function resetForm() {
            document.getElementById('addCanForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('formTitle').innerText = 'Добавить новую банку';
            document.getElementById('submitBtn').innerText = 'Добавить в каталог';
            document.getElementById('submitBtn').style.background = 'var(--accent)';
            document.getElementById('cancelBtn').style.display = 'none';
        }

        renderAdminList();
        renderStats();
        renderLogs();
    </script>
</body>
</html>
