<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админка - Моя Энергополка</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-form { background: #fff; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; }
        .admin-form label { display: block; margin-top: 15px; font-weight: 500; }
        .admin-form input, .admin-form textarea, .admin-form select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid var(--border); border-radius: 8px; }
        .admin-form button { margin-top: 20px; width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .admin-form button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚡ Моя Энергополка</div>
        <nav>
            <a href="index.html">Каталог</a>
        </nav>
    </header>

    <main>
        <h2 style="text-align: center; margin-bottom: 30px;">Добавить новую банку</h2>
        <form class="admin-form" id="addCanForm">
            <label>Название банки</label>
            <input type="text" id="canName" required placeholder="Например: Monster Ultra">

            <label>Бренд</label>
            <input type="text" id="canBrand" required placeholder="Например: Monster">

            <label>Ссылка на картинку (URL)</label>
            <input type="url" id="canImage" required placeholder="https://example.com/can.jpg">
            <small style="color: #777;">Совет: найди фото банки в интернете, нажми ПКМ -> "Копировать адрес картинки" и вставь сюда.</small>

            <label>Цвет банки (для градиента)</label>
            <input type="color" id="canColor" value="#007bff">

            <label>Оценка (от 1 до 10)</label>
            <input type="number" id="canRating" min="1" max="10" value="10">

            <button type="submit">Добавить в каталог</button>
        </form>
    </main>

    <script src="app.js"></script>
    <script>
        // Логика добавления банки
        document.getElementById('addCanForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const newCan = {
                id: Date.now(),
                name: document.getElementById('canName').value,
                brand: document.getElementById('canBrand').value,
                image: document.getElementById('canImage').value,
                color: document.getElementById('canColor').value,
                rating: document.getElementById('canRating').value
            };

            // Достаем текущие банки из памяти или создаем пустой массив
            let cans = JSON.parse(localStorage.getItem('energyCans')) || [];
            cans.push(newCan);
            
            // Сохраняем обратно
            localStorage.setItem('energyCans', JSON.stringify(cans));

            alert('Банка успешно добавлена!');
            this.reset();
        });
    </script>
</body>
</html>
