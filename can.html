<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Просмотр банки - FITTSSILFI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .can-detail { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); max-width: 600px; margin: 0 auto; border-top: 8px solid var(--can-color, #ccc); }
        .can-detail img { display: block; max-width: 200px; margin: 0 auto 20px; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.1)); }
        .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .detail-row span:first-child { font-weight: 500; color: #777; }
        .ai-box { background: #f0f7ff; padding: 20px; border-radius: 12px; margin-top: 30px; border: 1px solid #cce5ff; }
        .ai-box textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #b3d7ff; border-radius: 8px; margin-bottom: 10px; font-family: inherit; resize: vertical; }
        .ai-box button { background: var(--accent); color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: 0.3s; }
        .ai-box button:hover { background: #0056b3; }
        .ai-result { margin-top: 15px; font-style: italic; color: #333; background: #fff; padding: 15px; border-radius: 8px; border-left: 4px solid var(--accent); display: none; line-height: 1.5; }
        .loading-text { color: #0056b3; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <div class="logo">⚡ FITTSSILFI</div>
        <nav><a href="index.html">Назад в каталог</a></nav>
    </header>

    <main>
        <div id="canContainer" class="can-detail">
            <p style="text-align: center;">Загрузка...</p>
        </div>
    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const canId = urlParams.get('id');
        const cans = JSON.parse(localStorage.getItem('energyCans')) || [];
        const currentCan = cans.find(c => c.id === canId);

        if (currentCan) {
            const container = document.getElementById('canContainer');
            container.style.setProperty('--can-color', currentCan.color);
            
            container.innerHTML = `
                <img src="${currentCan.image}" alt="${currentCan.name}" onerror="this.src='https://via.placeholder.com/200?text=Нет+фото'">
                <h2 style="text-align: center; margin-bottom: 5px;">${currentCan.name}</h2>
                <p style="text-align: center; color: #777; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 20px;">${currentCan.brand}</p>
                
                <div class="detail-row"><span>Оценка:</span> <strong>★ ${currentCan.rating}/10</strong></div>
                <div class="detail-row"><span>Вкус:</span> <span>${currentCan.taste || 'Не указан'}</span></div>
                <div class="detail-row"><span>Газация:</span> <span>${currentCan.gas || 'Не указана'}</span></div>
                <div class="detail-row"><span>Бодрость:</span> <span>${currentCan.energy || 'Не указана'}</span></div>
                
                <div style="margin-top: 20px;">
                    <h3 style="margin-bottom: 10px;">Мой отзыв</h3>
                    <p style="line-height: 1.6; color: #444;">${currentCan.review || 'Текст отзыва пока не добавлен.'}</p>
                </div>

                <div class="ai-box">
                    <h3 style="margin-bottom: 10px; color: #0056b3;">🤖 ИИ-Помощник по отзывам</h3>
                    <p style="font-size: 14px; margin-bottom: 10px; color: #555;">Напиши пару слов (например: "сладко, бодрит, дизайн топ"), и ИИ напишет красивый отзыв.</p>
                    <textarea id="aiInput" placeholder="Твои мысли о банке..."></textarea>
                    <button onclick="generateAI()">Сгенерировать отзыв</button>
                    <div id="aiResult" class="ai-result"></div>
                </div>
            `;
        } else {
            document.getElementById('canContainer').innerHTML = '<p style="text-align: center; color: red;">Банка не найдена.</p>';
        }

        // НАСТОЯЩИЙ ИИ (через бесплатный API)
        async function generateAI() {
            const input = document.getElementById('aiInput').value;
            const resultDiv = document.getElementById('aiResult');
            
            if (!input.trim()) {
                alert("Напиши хоть что-то в поле ввода!");
                return;
            }

            resultDiv.style.display = 'block';
            resultDiv.innerHTML = '<span class="loading-text">🔄 ИИ думает над твоим отзывом...</span>';
            resultDiv.style.borderLeftColor = '#0056b3';

            try {
                // Промпт для ИИ (мы просим его написать отзыв в стиле блогера)
                const prompt = `Ты профессиональный блогер-дегустатор энергетиков. Напиши короткий, живой и вкусный отзыв (3-4 предложения) о напитке "${currentCan.name}" от бренда "${currentCan.brand}". Вкус: "${currentCan.taste}". Вот мои сырые мысли: "${input}". Сделай текст цепляющим, используй эмодзи.`;
                
                // Отправляем запрос на бесплатный сервер
                const response = await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
                
                if (!response.ok) throw new Error('Ошибка сети');
                
                const aiText = await response.text();
                
                resultDiv.innerHTML = `<strong>Вердикт ИИ:</strong> ${aiText}`;
                
            } catch (error) {
                console.error(error);
                // Если интернет отвалился, используем локальный шаблон
                resultDiv.innerHTML = `💡 <strong>Вердикт ИИ:</strong> Отличный выбор! ${input}. Этот напиток отлично вписывается в твою коллекцию, а дизайн банки добавляет ему баллов.`;
            }
        }
    </script>
</body>
</html>
