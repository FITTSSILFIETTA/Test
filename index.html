<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FITTSSILFI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" style="font-size: 22px;">⚡ FITTSSILFI</div>
        <nav>
            <a href="index.html">Каталог</a>
            <!-- Скрытая админка в виде шестеренки -->
            <a href="#" onclick="askPassword()" class="btn-admin" title="Админ-панель" style="background: none; padding: 5px; font-size: 20px; text-decoration: none;">⚙️</a>
        </nav>
    </header>

    <main>
        <section class="filters">
            <input type="text" id="searchInput" placeholder="Поиск по названию или бренду...">
            <select id="brandFilter">
                <option value="all">Все бренды</option>
            </select>
        </section>

        <section id="catalogGrid" class="catalog-grid">
            <!-- Карточки банок будут генерироваться через JS -->
        </section>
    </main>

    <script src="app.js"></script>
    
    <!-- Скрипт для пароля админки -->
    <script>
        function askPassword() {
            // Твой пароль
            const password = prompt("Введите пароль для входа в админку:");
            
            if (password === "Tommy Hilfiger 13") { 
                window.location.href = "admin.html"; // Перекидывает в админку при верном пароле
            } else if (password !== null) {
                alert("Неверный пароль! Доступ запрещен.");
            }
        }
    </script>
</body>
</html>
