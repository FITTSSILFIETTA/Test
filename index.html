<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Энергополка</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">⚡ Моя Энергополка</div>
        <nav>
            <a href="index.html">Каталог</a>
            <a href="admin.html" class="btn-admin">Админ-панель</a>
        </nav>
    </header>

    <main>
        <section class="filters">
            <input type="text" id="searchInput" placeholder="Поиск по названию или бренду...">
            <select id="brandFilter">
                <option value="all">Все бренды</option>
                <!-- Бренды будут добавляться автоматически -->
            </select>
        </section>

        <section id="catalogGrid" class="catalog-grid">
            <!-- Карточки банок будут генерироваться через JS -->
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
